[package]
name = "pinata"
version = "0.1.0"
description = "Pinata program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pinata"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Compile programs/pinata/src/tests.rs (LiteSVM 0.10 / solana-sdk). Off until rewrite.
legacy-litesvm-tests = []

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = "1.1.2"
bytemuck = "1"
# LiteSVM 0.16.0 tilde-pins these so they cannot drift to 2.7 / 3.5 in the lockfile.
solana-address = "~2.6.1"
solana-instruction = "~3.4.0"
solana-program-option = "3.1"
spl-token-2022-interface = "3"

[dev-dependencies]
litesvm = "0.16.0"
# LiteSVM 0.16 does not re-export these; tests must take them from here, not solana-sdk.
solana-account = "4.3"
solana-hash = "~4.5.0"
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-signer = "3.0.1"
solana-transaction = { version = "4.1.5", features = ["verify"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
