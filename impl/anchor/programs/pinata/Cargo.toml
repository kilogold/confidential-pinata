[package]
name = "pinata"
version = "0.1.0"
description = "Pinata program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pinata"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = "1.1.2"
bytemuck = "1"
solana-address = "~2.6.1"
solana-instruction = "~3.4.0"
solana-program-option = "3.1"
spl-token-2022-interface = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
